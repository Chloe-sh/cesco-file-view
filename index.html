function ko2en(s){let o='';for(const ch of s){const c=ch.charCodeAt(0);if(c>=0xAC00&&c<=0xD7A3){const x=c-0xAC00;o+=CH[Math.floor(x/588)]+JU[Math.floor(x%588/28)]+JO[x%28]}else o+=CJ[ch]||ch}return o}

async function tryPw(pw){const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(P.s),iterations:1000000,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(P.i)},k,b(P.d));return new TextDecoder().decode(pt)}
